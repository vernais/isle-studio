name: build-mac

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（未签名）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac:${{ matrix.arch }} -- --publish never

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: IsleStudio-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
